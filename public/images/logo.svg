<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="320" height="100">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: none; stroke: #111111; stroke-width: 1.5; }
    .letter-v { font-family: 'Playfair Display', 'Times New Roman', serif; font-size: 30px; fill: #111111; font-weight: bold; text-anchor: middle; dominant-baseline: central; }
    .text-vegars { font-family: 'Playfair Display', 'Times New Roman', serif; font-size: 24px; fill: #111111; letter-spacing: 5px; font-weight: bold; }
    .text-butikk { font-family: sans-serif; font-size: 9px; fill: #666666; letter-spacing: 7px; text-transform: uppercase; }
  </style>
  
  <!-- Klassisk ramme med V -->
  <g transform="translate(16, 20)">
    <rect x="0" y="0" width="60" height="60" class="box" />
    <text x="30" y="32" class="letter-v">V</text>
  </g>
  
  <!-- Tekstdel -->
  <text x="94" y="46" class="text-vegars">VEGARS</text>
  <text x="96" y="67" class="text-butikk">BUTIKK</text>
</svg>